<div class="blank-layout-container justify-content-center align-items-center bg-light">
  <div class="position-relative row w-100 h-100 bg-gredient justify-content-center">
    <div class="col-lg-4 d-flex align-items-center">
      <mat-card class="cardWithShadow boxed-auth">
        <mat-card-content class="p-32">
          <div class="text-center">
            <h1>Agroconecta</h1>
          </div>

          <form [formGroup]="form" (ngSubmit)="submit()" class="m-t-30">
            <!-- Campo de Nombre -->
            <mat-label class="mat-subtitle-2 f-s-14 f-w-600 m-b-12 d-block">Name</mat-label>
            <mat-form-field appearance="outline" class="w-100" color="primary">
              <input matInput formControlName="uname" />
            </mat-form-field>

            <!-- Campo de Email -->
            <mat-label class="mat-subtitle-2 f-s-14 f-w-600 m-b-12 d-block">Email Address</mat-label>
            <mat-form-field appearance="outline" class="w-100" color="primary">
              <input matInput formControlName="email" type="email" />
            </mat-form-field>

            <!-- Campo de Contraseña -->
            <mat-label class="mat-subtitle-2 f-s-14 f-w-600 m-b-12 d-block">Password</mat-label>
            <mat-form-field appearance="outline" class="w-100" color="primary">
              <input matInput formControlName="password" type="password" />
            </mat-form-field>

            <!-- Checkbox de aceptación de la política -->
            <div class="policy-section m-t-16">
              <mat-checkbox formControlName="acceptPolicy">
                He leído y acepto la
                <a routerLink="/policy" target="_blank" class="text-primary">política de tratamiento de datos</a>
              </mat-checkbox>
            </div>

            <!-- Botón de registro, deshabilitado si el formulario no es válido -->
            <button type="submit" mat-flat-button color="primary" class="w-100" [disabled]="!form.valid">
              Registrarme
            </button>
          </form>

          <span class="d-block f-w-500 text-center m-t-24">
            ¿Ya tienes cuenta?
            <a [routerLink]="['/authentication/login']" class="text-decoration-none text-primary f-w-500 f-s-14">
              Iniciar Sesión
            </a>
          </span>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
